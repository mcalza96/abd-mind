# Reglas invariantes del dominio financiero (experimento 5.4).
# Solo lectura para el agente: se editan aquí y se revisan como cualquier cambio de código (ADR-0004).
dominio: finanzas
version: 3
descripcion: >-
  Informes de analistas y otras fuentes sobre una empresa que se contradicen. Se busca el
  mecanismo económico que explica todos los hechos reportados.
variables:
  tasa_descuento: { tipo: numero, descripcion: Tasa de descuento usada en la valoración (fracción) }
  dividendos_pagados: { tipo: numero, descripcion: Dividendos pagados en el período }
  caja_disponible: { tipo: numero, descripcion: Caja disponible en el período }
  tendencia_precio:
    descripcion: Tendencia del precio de venta
    valores: [alza, estable, baja, baja_sostenida]
  tendencia_margen_bruto:
    descripcion: Tendencia del margen bruto
    valores: [alza, estable, estable_con_compensacion, baja]
  tendencia_volumen:
    descripcion: Tendencia del volumen de unidades vendidas
    valores: [alza, estable, baja]
# Analistas y prensa sin calibración propia: pueden equivocarse (ADR-0009).
confiabilidad_por_defecto: 0.9
reglas:
  - id: tasa_descuento_no_negativa
    tipo: dura
    descripcion: La tasa de descuento no puede ser negativa
    condicion: { variable: tasa_descuento, op: ">=", valor: 0 }

  - id: dividendos_bajo_caja
    tipo: dura
    descripcion: Los dividendos pagados no pueden exceder la caja disponible
    condicion: { variable: dividendos_pagados, op: "<=", variable_ref: caja_disponible }

  - id: reduccion_precio_comprime_margen
    tipo: dura
    descripcion: Una reducción de precios sostenida comprime el margen bruto
    condicion:
      si: { variable: tendencia_precio, op: "==", valor: baja_sostenida }
      entonces: { variable: tendencia_margen_bruto, op: "in", valor: [baja, estable_con_compensacion] }
