# Entorno sintético de sólidos (experimentos 5.1–5.3).
dominio: sintetico
version: 4
verificador: proyeccion   # las siluetas se calculan; no hace falta un LLM para C
descripcion: >-
  Un objeto físico es observado desde distintas vistas (frontal, cenital, lateral). Cada
  observador reporta la silueta que ve. Se busca qué objeto proyecta todas las siluetas.
variables:
  solido:
    tipo: entidad
    descripcion: >-
      Nombre del sólido, en minúsculas, sin tildes y con guiones bajos
      (p. ej. cilindro, esfera, cubo, cono, elipsoide, tapon_universal)
  silueta:
    descripcion: Silueta que reporta un observador
    valores: [circulo, rectangulo, cuadrado, triangulo, elipse]
  dimension:
    tipo: numero
    descripcion: Número de dimensiones del objeto (2 si es una figura plana, 3 si es un sólido)
# Las siluetas se calculan exactamente: los observadores sintéticos son infalibles.
confiabilidad_por_defecto: 1.0
vocabulario: [esfera, cubo, cilindro, cono, elipsoide]
marcos_posibles:
  - { nombre: Vista frontal, marco: vista frontal, parametros: { vista: frontal } }
  - { nombre: Vista cenital, marco: vista cenital, parametros: { vista: cenital } }
  - { nombre: Vista lateral, marco: vista lateral, parametros: { vista: lateral } }
reglas:
  - id: objeto_tridimensional
    tipo: dura
    descripcion: El objeto observado es un sólido tridimensional
    condicion: { variable: dimension, op: "==", valor: 3 }
