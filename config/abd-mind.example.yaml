# Configuración de abd-mind. Copiar a ~/.abd-mind/config.yaml (o apuntar ABD_MIND_CONFIG) y ajustar.
# Lista de modelos disponibles: `uv run abd-mind modelos`.

proveedor:
  base_url: https://opencode.ai/inference/go/v1
  api_key_env: OPENCODE_API_KEY   # si no está definida, no se envía Authorization
  timeout_s: 180

# Cómo se habla con cada modelo (según la tabla de endpoints de OpenCode Go).
# streaming: la pasarela corta a los ~30 s las respuestas sin streaming.
modelos:
  muse-spark-1.3-contributor: { api: responses, salida_json: json_schema, streaming: true }
  muse-spark-1.2-contributor: { api: responses, salida_json: json_schema, streaming: true }
  deepseek-v4.1-flash: { api: chat, salida_json: json_object, streaming: true }   # no acepta json_schema

roles:
  cortex: { modelo: deepseek-v4.1-flash, temperatura: 0.0, max_tokens: 8000 }
  generadores:
    - { modelo: muse-spark-1.3-contributor, temperatura: 1.0, max_tokens: 16000 }
    - { modelo: muse-spark-1.2-contributor, temperatura: 1.0, max_tokens: 16000 }
  # Distinto de los generadores (ADR-0002).
  verificador: { modelo: deepseek-v4.1-flash, temperatura: 0.0, max_tokens: 8000 }
  # Línea base: una sola llamada, sin pipeline (D10).
  linea_base:
    - { modelo: muse-spark-1.3-contributor, max_tokens: 16000 }
    - { modelo: muse-spark-1.2-contributor, max_tokens: 16000 }
    - { modelo: deepseek-v4.1-flash, max_tokens: 8000 }

pesos: { alpha: 1.5, beta: 10.0, gamma: 1.0, tau: null }   # tau se calibra en la fase 7

presupuestos:
  hipotesis_por_ronda: 5
  reintentos_json: 2
  llamadas_por_operacion: 60
  llamadas_por_caso: 500

cache_dir: ~/.abd-mind/cache
