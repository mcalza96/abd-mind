# Configuración de abd-mind. Copiar a ~/.abd-mind/config.yaml (o apuntar ABD_MIND_CONFIG) y ajustar.
# Lista de modelos disponibles: `uv run abd-mind modelos`.

proveedor:
  base_url: https://opencode.ai/inference/go/v1
  api_key_env: OPENCODE_API_KEY   # si no está definida, no se envía Authorization
  timeout_s: 180

# Cómo se habla con cada modelo (según la tabla de endpoints de OpenCode Go).
# streaming: la pasarela corta a los ~30 s las respuestas sin streaming.
modelos:
  muse-spark-1.3-contributor: { api: responses, salida_json: json_schema, streaming: true }
  muse-spark-1.2-contributor: { api: responses, salida_json: json_schema, streaming: true }
  deepseek-v4.1-flash: { api: chat, salida_json: json_object, streaming: true }   # no acepta json_schema

roles:
  cortex: { modelo: deepseek-v4.1-flash, temperatura: 0.0, max_tokens: 8000 }
  # fallback: modelo que responde si el principal falla (error del proveedor o JSON inválido).
  # Un solo modelo para todos los roles (decisión del usuario, 2026-10-15). Muse 1.2 y 1.3 son
  # modelos "contributor": entrenan con los prompts y su acceso se bloqueó. Con un solo modelo,
  # generador y verificador no son independientes (ADR-0002 suspendida, ver la nota en el ADR).
  generadores:
    - { modelo: deepseek-v4.1-flash, temperatura: 1.0, max_tokens: 32000 }
  verificador: { modelo: deepseek-v4.1-flash, temperatura: 0.0, max_tokens: 32000 }
  # Línea base: una sola llamada, sin pipeline (D10).
  linea_base:
    - { modelo: deepseek-v4.1-flash, max_tokens: 32000 }

pesos:
  alpha: 1.5
  beta: 10.0
  gamma: 1.0
  tau: null             # umbral de aceptación; se calibra en la fase 7
  lambda_residuo: 1.0   # costo de atribuir un hecho a error del observador (ADR-0009)
  omega_derrota: 0.95   # confiabilidad mínima para que un hecho derrote por sí solo
  delta_empate: 1.0e-6  # diferencia de score que cuenta como empate (ADR-0010)
  peso_esperable: 0.5   # peso en C de un hecho "esperable" no predicho (ADR-0015; a priori)
  veredictos_fragil: 1  # respuesta frágil si cambiar este número de veredictos LLM la invierte (ADR-0012)

presupuestos:
  hipotesis_por_ronda: 5
  hipotesis_vivas_max: 20
  reintentos_json: 2
  llamadas_por_operacion: 60
  llamadas_por_caso: 500

cache_dir: ~/.abd-mind/cache     # caché de los experimentos por CLI
base_datos: ~/.abd-mind/abd-mind.db   # casos (el motor guarda ahí también su caché LLM)
