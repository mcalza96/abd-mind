[project]
name = "abd-mind"
version = "0.1.0"
description = "Motor de razonamiento abductivo: selección de hipótesis por virtudes explicativas, desacoplada de la verosimilitud del LLM."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
abd-mind = "factory.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Textos en español con símbolos matemáticos (α, γ, ≈, −) son intencionales.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
